name: Prelaunch checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline tests
        run: node --test test/*.test.mjs
      - name: Check read-only dead deposit calculator
        run: node scripts/dead-deposit.mjs
      - name: Verify production is blocked
        run: |
          if node scripts/risk-gate.mjs; then
            echo "ERROR: Unsafe production gate passed"
            exit 1
          else
            echo "PASS: Missing production prerequisites block deployment"
          fi
